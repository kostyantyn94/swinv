; SWInv - example Ansible inventory for the Linux/macOS part of the fleet.
; Copy to inventory.ini (git-ignored: *.local.*  ->  inventory.local.ini also works) and edit.
;
;   ansible-playbook -i inventory.ini deploy-collector.yml
;   ansible-playbook -i inventory.ini uninstall-collector.yml
;
; The token is a secret: keep it in ansible-vault (ansible-vault encrypt_string ... --name swinv_token)
; or pass it on the command line instead of storing it here:
;   ansible-playbook -i inventory.ini deploy-collector.yml -e swinv_token=$INVENTORY_WEBHOOK_TOKEN

[workstations]
ws-lin-01 ansible_host=10.10.20.11
ws-lin-02 ansible_host=10.10.20.12 swinv_time=03:30

[workstations:vars]
ansible_user=swinv-deploy
ansible_become=true

; n8n ingest endpoint reachable from the workstation
swinv_webhook_url=http://n8n.corp.local:5678/webhook/inventory/ingest
; INVENTORY_WEBHOOK_TOKEN from the server .env (X-Inventory-Token header)
swinv_token=CHANGE-ME-WEBHOOK-TOKEN

; Optional overrides (defaults are in deploy-collector.yml):
; swinv_time=daily          ; systemd OnCalendar expression: daily, 20:00, Mon..Fri 20:00, ...
; swinv_random_delay_sec=3600
; swinv_sources=dpkg,snap,pip  ; empty = auto-detect every package manager present
