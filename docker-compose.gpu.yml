# Optional override: NVIDIA GPU for Ollama (Docker Desktop on Windows/WSL2 or Linux with nvidia-container-toolkit).
# Enabled by setup.ps1 / setup.sh automatically when an NVIDIA runtime is detected, via COMPOSE_FILE in .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.gpu.yml
# Without it Ollama runs on CPU (slower, still correct). On macOS run Ollama natively and set
# OLLAMA_BASE_URL=http://host.docker.internal:11434 in .env instead.
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
